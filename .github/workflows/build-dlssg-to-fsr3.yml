name: build dlssg-to-fsr3
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag oficial de Nukem9/dlssg-to-fsr3
        required: true
        default: "0.130"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    env:
      VULKAN_VERSION: 1.3.296.0
    steps:
      - name: Fonte oficial na tag pedida
        uses: actions/checkout@v4
        with:
          repository: Nukem9/dlssg-to-fsr3
          ref: ${{ inputs.tag }}
          submodules: recursive
          path: src
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe"
          Invoke-WebRequest $url -OutFile vk.exe
          Start-Process -Wait -FilePath .\vk.exe -ArgumentList '--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install'
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -Append $env:GITHUB_ENV
          "C:\VulkanSDK\Bin" | Out-File -Append $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: WinPixEventRuntime (NuGet oficial da Microsoft; o FidelityFX espera em libs/pix/bin)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/WinPixEventRuntime/1.0.240308001" -OutFile pix.zip
          Expand-Archive pix.zip -DestinationPath pix
          $dst = "src/dependencies/FidelityFX-SDK/sdk/libs/pix/bin"
          New-Item -ItemType Directory -Force "$dst/x64" | Out-Null
          Copy-Item pix/bin/x64/WinPixEventRuntime.dll, pix/bin/x64/WinPixEventRuntime.lib "$dst/x64/"
          Copy-Item pix/bin/x64/WinPixEventRuntime.dll, pix/bin/x64/WinPixEventRuntime.lib "$dst/"
          Get-ChildItem -Recurse $dst | Select-Object FullName
      - name: FidelityFX SDK (vendorizado no repositório)
        shell: cmd
        working-directory: src/dependencies
        run: call Build-FFX-SDK.bat
      - name: dlssg-to-fsr3 (Make-Release.ps1 oficial)
        shell: pwsh
        working-directory: src
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          .\Make-Release.ps1
      - name: Coletar pacotes e hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Get-ChildItem src/bin -Recurse -Include *.zip,*.7z | Copy-Item -Destination out
          Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Join-String -Separator "`n" | Set-Content -NoNewline out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
          $commit = git -C src rev-parse HEAD
          "COMMIT=$commit" | Out-File -Append $env:GITHUB_ENV
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dlssg-to-fsr3-${{ inputs.tag }}"
          $notes = "Build de Nukem9/dlssg-to-fsr3 tag ${{ inputs.tag }} (commit $env:COMMIT), sem modificações. Fonte: https://github.com/Nukem9/dlssg-to-fsr3/tree/$env:COMMIT . Licença GPL-3.0. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh release create $tag (Get-ChildItem out/*) --repo ${{ github.repository }} --title $tag --notes $notes
